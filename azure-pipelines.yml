trigger:
  branches:
    include:
      - main

pool:
  name: 'Axion Agent'

variables:
  azureServiceConnection: 'Axion serv connection'
  acrName: 'RaiAcr'
  imageRepository: 'axion-ui'
  aksResourceGroup: 'myKoreaRG'
  aksClusterName: 'myAKSCluster'
  kubernetesNamespace: 'default'

stages:
  - stage: BuildAndPush
    displayName: 'Build and Push Docker Image'
    jobs:
      - job: Build
        displayName: 'Build, Test and Push'
        steps:
          - checkout: self

          - task: UseNode@1
            displayName: 'Install Node.js'
            inputs:
              version: '22.x'

          - script: |
              npm ci
              npm run lint
              npm run build
            displayName: 'Install dependencies, lint and build'

          - task: AzureCLI@2
            displayName: 'Build and Push Image to ACR'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'ps'
              scriptLocation: 'inlineScript'
              inlineScript: |
                $ErrorActionPreference = 'Stop'
                az acr login --name "$(acrName)"
                if ($LASTEXITCODE -ne 0) { throw "ACR login failed" }

                $imageTag = "$(Build.BuildId)"
                $image = "$(acrName).azurecr.io/$(imageRepository):$imageTag"

                docker build -t $image .
                if ($LASTEXITCODE -ne 0) { throw "Docker build failed" }

                docker push $image
                if ($LASTEXITCODE -ne 0) { throw "Docker push failed" }

                Write-Host "Built and pushed image: $image"
                Write-Host "##vso[task.setvariable variable=imageTag;isOutput=true]$imageTag"
            name: imageBuild

  - stage: DeployToAKS
    displayName: 'Deploy to AKS'
    dependsOn: BuildAndPush
    condition: succeeded()
    jobs:
      - deployment: Deploy
        displayName: 'Deploy Axion UI'
        environment: 'axion-ui-production'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: AzureCLI@2
                  displayName: 'Apply Kubernetes Manifests'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: 'ps'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                    $ErrorActionPreference = 'Stop'

		                  $imageTag = "$(Build.BuildId)"
                      if ([string]::IsNullOrWhiteSpace($imageTag)) {
                        throw "Image tag is empty"
                      }

                      az aks get-credentials --resource-group "$(aksResourceGroup)" --name "$(aksClusterName)" --overwrite-existing
                      if ($LASTEXITCODE -ne 0) { throw "Could not get AKS credentials" }

                      kubectl create namespace "$(kubernetesNamespace)" --dry-run=client -o yaml | kubectl apply -f -
                      if ($LASTEXITCODE -ne 0) { throw "Namespace setup failed" }

                      kubectl set image -f k8s/deployment.yaml axion-ui="$(acrName).azurecr.io/$(imageRepository):$imageTag" --local -o yaml | kubectl apply -n "$(kubernetesNamespace)" -f -
                      if ($LASTEXITCODE -ne 0) { throw "Deployment apply failed" }

                      kubectl apply -n "$(kubernetesNamespace)" -f k8s/service.yaml
                      if ($LASTEXITCODE -ne 0) { throw "Service apply failed" }

                                            $manifest = Get-Content "k8s/deployment.yaml" -Raw
                      $image = "$(acrName).azurecr.io/$(imageRepository):$imageTag"
                      $manifest = $manifest.Replace("raiacr.azurecr.io/axion-ui:latest", $image)

                      $tempManifest = Join-Path $env:AGENT_TEMPDIRECTORY "deployment.yaml"
                      Set-Content -Path $tempManifest -Value $manifest -Encoding utf8

                      
                      kubectl apply -n "$(kubernetesNamespace)" -f $tempManifest
                      if ($LASTEXITCODE -ne 0) { throw "Deployment apply failed" }

                      kubectl apply -n "$(kubernetesNamespace)" -f k8s/service.yaml
                      if ($LASTEXITCODE -ne 0) { throw "Service apply failed" }

                      kubectl rollout status deployment/axion-ui -n "$(kubernetesNamespace)" --timeout=180s
                      if ($LASTEXITCODE -ne 0) { throw "Deployment rollout failed" }

                      kubectl get pods,svc -n "$(kubernetesNamespace)"
